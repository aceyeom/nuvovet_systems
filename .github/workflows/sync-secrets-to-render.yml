name: Sync secrets to Render

on:
  push:
    branches: [main]
  workflow_dispatch: # allows manual trigger from GitHub Actions tab

jobs:
  sync-env:
    runs-on: ubuntu-latest
    steps:
      - name: Push ANTHROPIC_API_KEY to Render
        run: |
          curl -sf -X PUT "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/env-vars" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '[{"key":"ANTHROPIC_API_KEY","value":"${{ secrets.ANTHROPIC_API_KEY }}"}]'
          echo "Secret synced to Render."
